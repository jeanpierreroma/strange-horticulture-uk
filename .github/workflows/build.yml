name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: ukrainizer-windows.zip
          - os: macos-latest
            asset: ukrainizer-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --console --name ukrainizer --add-data "translation.json;." --add-data "textures;textures" ukrainizer.py
          Compress-Archive -Path dist/ukrainizer.exe, README.txt -DestinationPath ${{ matrix.asset }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --console --name ukrainizer --add-data "translation.json:." --add-data "textures:textures" ukrainizer.py
          printf '#!/bin/bash\ncd "$(dirname "$0")"\nxattr -d com.apple.quarantine ./ukrainizer 2>/dev/null\n./ukrainizer\n' > "Встановити.command"
          printf '#!/bin/bash\ncd "$(dirname "$0")"\nxattr -d com.apple.quarantine ./ukrainizer 2>/dev/null\n./ukrainizer --restore\n' > "Повернути оригінал.command"
          chmod +x dist/ukrainizer *.command
          cp dist/ukrainizer .
          zip -9 ${{ matrix.asset }} ukrainizer *.command README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
